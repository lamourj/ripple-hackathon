<!DOCTYPE html>
<!--
  Ripple — Change Impact Desk · live frontend
  ================================================================
  Serve this directory (it also holds the live events.json) with:

      python -m http.server 8000 --directory outputs/frontend

  Then open http://localhost:8000 . The page polls events.json once a
  second and renders the causal effect tree + stakeholder stances as the
  Ripple swarm produces them. Contract/schema: see TEAM_SPLIT.md.
  No build step, no framework — just open it while run_ripple.py runs.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ripple — Change Impact Desk</title>
<style>
  :root {
    --bg: #0e1117; --panel: #161b24; --panel-2: #1d2430; --line: #2b3341;
    --ink: #e6edf3; --ink-dim: #8b96a5; --accent: #4da3ff;
    --green: #3fb950; --red: #f85149; --amber: #d29922; --purple: #a371f7;
    --grey: #6e7681;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 16px 22px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .3px; }
  header .init { color: var(--ink-dim); font-size: 13px; }
  header .init b { color: var(--ink); font-weight: 600; }
  header .status { margin-left: auto; font-size: 12px; color: var(--ink-dim); }
  header .dot { display:inline-block; width:8px; height:8px; border-radius:50%;
    background: var(--green); margin-right:6px; animation: pulse 1.4s infinite; }

  .layout { display: grid; grid-template-columns: 220px 1fr 320px; height: calc(100vh - 62px); }
  .col { overflow: auto; }
  .specialists { border-right: 1px solid var(--line); padding: 14px; }
  .stage { position: relative; background: var(--bg); }
  .detail { border-left: 1px solid var(--line); padding: 16px; background: var(--panel); }

  h2.section { font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--ink-dim); margin: 0 0 12px; }

  /* Specialists panel */
  .spec { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 10px; }
  .spec .name { font-weight: 600; font-size: 13px; }
  .spec .role { color: var(--ink-dim); font-size: 11px; margin-top: 2px; }
  .chip { display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 600; margin-top: 8px; border: 1px solid transparent; }
  .chip.waiting { color: var(--ink-dim); border-color: var(--line); }
  .chip.thinking { color: var(--accent); border-color: var(--accent); animation: pulse 1.2s infinite; }
  .chip.adopt { color: var(--green); border-color: var(--green); background: #12351b; }
  .chip.block { color: var(--red); border-color: var(--red); background: #3a1618; }
  .chip.circumvent { color: var(--amber); border-color: var(--amber); background: #362b12; }
  .chip.escalate { color: var(--purple); border-color: var(--purple); background: #2a1f3d; }
  .spec .count { color: var(--ink-dim); font-size: 11px; margin-left: 6px; }

  /* Tree */
  #stageInner { position: relative; min-width: 100%; }
  svg.wires { position: absolute; top:0; left:0; pointer-events: none; }
  .node {
    position: absolute; width: 230px; min-height: 68px; padding: 9px 11px;
    background: var(--panel-2); border: 1.5px solid var(--line); border-radius: 10px;
    cursor: pointer; transition: border-color .2s, box-shadow .2s, opacity .3s;
    display: flex; flex-direction: column; gap: 4px;
  }
  .node:hover { box-shadow: 0 0 0 2px var(--accent); }
  .node.selected { box-shadow: 0 0 0 2px var(--accent); }
  .node .label { font-size: 12.5px; line-height: 1.35; }
  .node .meta { font-size: 10px; color: var(--ink-dim); display:flex; gap:8px; align-items:center; }
  .node.root { background: #10233b; border-color: var(--accent); width: 260px; }
  .node.root .label { font-weight: 600; }

  .node.propagates { border-color: var(--green); }
  .node.blocked    { border-color: var(--red); background: #2a1618; }
  .node.preempted  { border-color: var(--grey); opacity: .38; }
  .node.pending    { border-color: var(--line); }
  .node.pending .dotp { display:inline-block; width:7px;height:7px;border-radius:50%;
    background: var(--accent); animation: pulse 1.1s infinite; }

  .pol { font-size: 9.5px; padding: 1px 6px; border-radius: 4px; text-transform: uppercase; letter-spacing:.5px; }
  .pol.positive { color: var(--green); background:#12351b; }
  .pol.negative { color: var(--amber); background:#362b12; }
  .pol.perverse { color: var(--red);   background:#3a1618; }
  .assign { display:inline-block; width:9px;height:9px;border-radius:2px;margin-left:2px; }

  /* Detail panel */
  .detail .empty { color: var(--ink-dim); font-size: 13px; }
  .detail h3 { font-size: 15px; margin: 0 0 6px; }
  .quote { background: var(--panel-2); border-left: 3px solid var(--line);
    padding: 8px 11px; border-radius: 0 8px 8px 0; margin: 8px 0; }
  .quote .who { font-size: 11px; color: var(--ink-dim); margin-bottom: 3px;
    display:flex; align-items:center; gap:8px; }
  .quote .text { font-size: 13px; font-style: italic; }
  .badge { font-size: 10px; padding: 1px 7px; border-radius: 999px; font-weight:600; }
  .legend { padding: 12px 14px; border-top: 1px solid var(--line); font-size: 11px; color: var(--ink-dim); }
  .legend span { display:inline-flex; align-items:center; gap:5px; margin-right:14px; }
  .legend i { width:10px;height:10px;border-radius:3px;display:inline-block; }

  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.35;} }
</style>
</head>
<body>
  <header>
    <h1>🌊 Ripple — Change Impact Desk</h1>
    <div class="init" id="initiative">Waiting for an initiative…</div>
    <div class="status"><span class="dot"></span><span id="statusText">connecting…</span></div>
  </header>

  <div class="layout">
    <div class="col specialists">
      <h2 class="section">Stakeholders</h2>
      <div id="specialists"></div>
    </div>

    <div class="col stage">
      <div id="stageInner">
        <svg class="wires" id="wires"></svg>
      </div>
      <div class="legend">
        <span><i style="background:var(--green)"></i>propagates</span>
        <span><i style="background:var(--red)"></i>blocked</span>
        <span><i style="background:var(--grey)"></i>pre-empted</span>
        <span><i style="background:var(--accent)"></i>awaiting stance</span>
      </div>
    </div>

    <div class="col detail" id="detail">
      <h2 class="section">Stakeholder reaction</h2>
      <div class="empty">Click any effect node to see who owns it and what they said.</div>
    </div>
  </div>

<script>
const SPECIALISTS = [
  { key: "budget",  name: "Budget Sponsor",       role: "cost · ROI · hidden costs" },
  { key: "enduser", name: "Operational End-User", role: "workload · friction · trust" },
  { key: "itdata",  name: "IT/Data Owner",        role: "data · integration · debt" },
  { key: "risk",    name: "Risk & Compliance",    role: "regulatory · governance · rep" },
];
const SPEC_BY_KEY = Object.fromEntries(SPECIALISTS.map(s => [s.key, s]));
const SPEC_COLOR = { budget:"#4da3ff", enduser:"#3fb950", itdata:"#d29922", risk:"#a371f7" };

// ---- state, rebuilt from the full event array each poll (idempotent fold) ----
let selectedId = null;
let lastLen = -1;

function foldEvents(events) {
  const s = {
    initiative: null, sector: null, orgSize: null,
    nodes: {}, order: [],
    called: {},            // specialist -> Set(node_ids) it was asked about
    latestStance: {},      // specialist -> last stance string
    stanceCount: {},       // specialist -> # stances returned
    finished: false, docx: null, frontendUrl: null,
  };
  for (const e of events) {
    switch (e.type) {
      case "run_started":
        s.initiative = e.initiative; s.sector = e.sector; s.orgSize = e.org_size; break;
      case "node_created":
        if (!s.nodes[e.id]) s.order.push(e.id);
        s.nodes[e.id] = { id: e.id, parent_id: e.parent_id, label: e.label,
          depth: e.depth, polarity: e.polarity, assigned: e.assigned || [],
          stances: {}, pruned: false };
        break;
      case "specialist_called":
        (s.called[e.specialist] ||= new Set());
        (e.node_ids || []).forEach(id => s.called[e.specialist].add(id));
        break;
      case "stance_received": {
        const n = s.nodes[e.node_id];
        if (n) n.stances[e.specialist] = { stance: e.stance, reaction: e.reaction };
        s.latestStance[e.specialist] = e.stance;
        s.stanceCount[e.specialist] = (s.stanceCount[e.specialist] || 0) + 1;
        break;
      }
      case "node_pruned": {
        const n = s.nodes[e.node_id];
        if (n) { n.pruned = true; n.pruneReason = e.reason; }
        break;
      }
      case "run_finished":
        s.finished = true; s.docx = e.docx; s.frontendUrl = e.frontend_url; break;
    }
  }
  return s;
}

function nodeStatus(n) {
  if (n.pruned) return "preempted";
  const stances = Object.values(n.stances);
  if (stances.some(x => x.stance === "block")) return "blocked";
  if (n.assigned.length && n.assigned.every(k => n.stances[k])) return "propagates";
  return "pending";
}

// ---- layout: root on top, one column per direct effect, children stacked ----
const NODE_W = 230, ROOT_W = 260, COL_W = 272, ROOT_Y = 24, DIRECT_Y = 132;
const CHILD_Y0 = 268, CHILD_GAP = 104, NODE_H = 72;

function computeLayout(s) {
  const pos = {};
  const directs = s.order.map(id => s.nodes[id]).filter(n => n.depth === 1);
  directs.forEach((d, i) => {
    const x = 30 + i * COL_W;
    pos[d.id] = { x, y: DIRECT_Y, w: NODE_W };
    const kids = s.order.map(id => s.nodes[id]).filter(n => n.parent_id === d.id);
    kids.forEach((c, j) => { pos[c.id] = { x, y: CHILD_Y0 + j * CHILD_GAP, w: NODE_W }; });
  });
  // root centered over the columns
  const n = Math.max(directs.length, 1);
  const spanCenter = 30 + ((n - 1) * COL_W) / 2 + NODE_W / 2;
  pos["__root__"] = { x: spanCenter - ROOT_W / 2, y: ROOT_Y, w: ROOT_W };
  const maxKids = Math.max(0, ...directs.map(d =>
    s.order.filter(id => s.nodes[id].parent_id === d.id).length));
  const width = Math.max(30 + n * COL_W, 600);
  const height = CHILD_Y0 + Math.max(1, maxKids) * CHILD_GAP + 40;
  return { pos, width, height, directs };
}

function render(s) {
  // header
  document.getElementById("initiative").innerHTML = s.initiative
    ? `<b>${esc(s.initiative)}</b>` +
      (s.sector && s.sector !== "(not specified)" ? ` · ${esc(s.sector)}` : "") +
      (s.orgSize && s.orgSize !== "(not specified)" ? ` · ${esc(s.orgSize)}` : "")
    : "Waiting for an initiative…";
  document.getElementById("statusText").textContent =
    s.finished ? "report ready ✓" : "swarm running…";

  renderSpecialists(s);
  renderTree(s);
  if (selectedId) renderDetail(s, selectedId);
}

function renderSpecialists(s) {
  const el = document.getElementById("specialists");
  el.innerHTML = SPECIALISTS.map(sp => {
    const stance = s.latestStance[sp.key];
    const called = s.called[sp.key] && s.called[sp.key].size > 0;
    const count = s.stanceCount[sp.key] || 0;
    let chip;
    if (stance) chip = `<span class="chip ${stance}">${stance}${count>1?`<span class="count">×${count}</span>`:""}</span>`;
    else if (called) chip = `<span class="chip thinking">thinking…</span>`;
    else chip = `<span class="chip waiting">idle</span>`;
    return `<div class="spec">
      <div class="name"><span class="assign" style="background:${SPEC_COLOR[sp.key]}"></span> ${sp.name}</div>
      <div class="role">${sp.role}</div>${chip}</div>`;
  }).join("");
}

function renderTree(s) {
  const { pos, width, height, directs } = computeLayout(s);
  const inner = document.getElementById("stageInner");
  inner.style.width = width + "px";
  inner.style.height = height + "px";

  // nodes (keep the <svg> first child, replace the rest)
  [...inner.querySelectorAll(".node")].forEach(n => n.remove());

  const nodesToDraw = [];
  if (s.initiative) nodesToDraw.push({
    id: "__root__", root: true, label: s.initiative, p: pos["__root__"] });
  for (const id of s.order) {
    const n = s.nodes[id];
    if (pos[id]) nodesToDraw.push({ id, node: n, p: pos[id] });
  }

  for (const item of nodesToDraw) {
    const div = document.createElement("div");
    if (item.root) {
      div.className = "node root";
      div.style.left = item.p.x + "px"; div.style.top = item.p.y + "px";
      div.innerHTML = `<div class="meta">INITIATIVE</div><div class="label">${esc(item.label)}</div>`;
    } else {
      const n = item.node, st = nodeStatus(n);
      div.className = `node ${st}${selectedId === n.id ? " selected" : ""}`;
      div.style.left = item.p.x + "px"; div.style.top = item.p.y + "px";
      const assignDots = n.assigned.map(k =>
        `<span class="assign" title="${SPEC_BY_KEY[k]?.name||k}" style="background:${SPEC_COLOR[k]||'#888'}"></span>`).join("");
      const pulse = st === "pending" ? `<span class="dotp"></span>` : "";
      div.innerHTML = `
        <div class="label">${esc(n.label)}</div>
        <div class="meta">
          <span class="pol ${n.polarity}">${n.polarity}</span>
          ${assignDots} ${pulse}
        </div>`;
      div.onclick = () => { selectedId = n.id; render(currentState); };
    }
    inner.appendChild(div);
  }

  drawWires(s, pos, width, height);
}

function drawWires(s, pos, width, height) {
  const svg = document.getElementById("wires");
  svg.setAttribute("width", width); svg.setAttribute("height", height);
  const seg = (a, b, dim) => {
    if (!a || !b) return "";
    const x1 = a.x + a.w / 2, y1 = a.y + NODE_H, x2 = b.x + b.w / 2, y2 = b.y;
    const my = (y1 + y2) / 2;
    return `<path d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}"
      stroke="${dim ? '#2b3341' : '#3a4657'}" stroke-width="1.6" fill="none"/>`;
  };
  let paths = "";
  for (const id of s.order) {
    const n = s.nodes[id];
    const dim = nodeStatus(n) === "preempted";
    if (n.depth === 1) paths += seg(pos["__root__"], pos[id], false);
    else if (n.parent_id) paths += seg(pos[n.parent_id], pos[id], dim);
  }
  svg.innerHTML = paths;
}

function renderDetail(s, id) {
  const el = document.getElementById("detail");
  const n = s.nodes[id];
  if (!n) { el.innerHTML = `<h2 class="section">Stakeholder reaction</h2><div class="empty">—</div>`; return; }
  const st = nodeStatus(n);
  const stColor = { propagates:"var(--green)", blocked:"var(--red)", preempted:"var(--grey)", pending:"var(--accent)" }[st];
  let quotes = n.assigned.map(k => {
    const sp = SPEC_BY_KEY[k]; const r = n.stances[k];
    const who = `<span class="who"><span class="assign" style="background:${SPEC_COLOR[k]}"></span>${sp?.name||k}</span>`;
    if (!r) return `<div class="quote">${who}<div class="text" style="font-style:normal;color:var(--ink-dim)">awaiting stance…</div></div>`;
    return `<div class="quote">
      <div class="who"><span class="assign" style="background:${SPEC_COLOR[k]}"></span>${sp?.name||k}
        <span class="chip ${r.stance}" style="margin:0">${r.stance}</span></div>
      <div class="text">“${esc(r.reaction)}”</div></div>`;
  }).join("");
  el.innerHTML = `
    <h2 class="section">Stakeholder reaction</h2>
    <h3>${esc(n.label)}</h3>
    <div style="font-size:12px;color:var(--ink-dim);margin-bottom:10px">
      <span class="pol ${n.polarity}">${n.polarity}</span>
      &nbsp;·&nbsp; <span style="color:${stColor};font-weight:600">${st}</span>
      ${n.pruned ? `<br><span style="color:var(--grey)">⤷ ${esc(n.pruneReason||"pre-empted")}</span>` : ""}
    </div>
    ${quotes || '<div class="empty">No specialist assigned.</div>'}`;
}

function esc(x) { return String(x == null ? "" : x)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// ---- polling loop ----
let currentState = { nodes: {}, order: [] };
async function poll() {
  try {
    const res = await fetch(`events.json?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const events = await res.json();
    if (events.length !== lastLen) {
      lastLen = events.length;
      currentState = foldEvents(events);
      render(currentState);
    }
    document.querySelector(".dot").style.background = "var(--green)";
  } catch (err) {
    document.getElementById("statusText").textContent = "waiting for events.json…";
    document.querySelector(".dot").style.background = "var(--amber)";
  }
}
poll();
setInterval(poll, 1000);
</script>
</body>
</html>
