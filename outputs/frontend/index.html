<!DOCTYPE html>
<!--
  Ripple — Change Impact Desk · live frontend
  ================================================================
  Serve this directory (it also holds the live events.json) with:

      python -m http.server 8000 --directory outputs/frontend

  Then open http://localhost:8000 . The page polls events.json once a
  second and REVEALS the stakeholder negotiation at a conversational pace,
  so it feels live whether the swarm is still running or you're replaying a
  finished run. Contract/schema: see TEAM_SPLIT.md. No build step, no framework.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ripple — Change Impact Desk</title>
<style>
  :root {
    --bg:#0d1017; --panel:#151a23; --panel2:#1b212c; --line:#2a3240;
    --ink:#e8eef5; --dim:#8a95a5; --faint:#5c6675;
    --adopt:#3fb950; --block:#f85149; --circumvent:#e3a008; --escalate:#a371f7;
    --budget:#4da3ff; --enduser:#22c7a9; --itdata:#e0a458; --risk:#c77dff;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }

  /* ---------- header ---------- */
  header { padding:14px 24px 12px; border-bottom:1px solid var(--line); }
  .brandline { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; letter-spacing:.2px; }
  .live { margin-left:auto; font-size:12px; color:var(--dim); display:flex; align-items:center; gap:7px; }
  .live .dot { width:8px;height:8px;border-radius:50%;background:var(--adopt);animation:pulse 1.4s infinite; }
  .pitch { color:var(--dim); font-size:13px; margin-top:5px; max-width:900px; }
  .pitch b { color:var(--ink); font-weight:600; }

  /* ---------- resistance strip ---------- */
  .resistance { display:flex; gap:10px; padding:12px 24px; border-bottom:1px solid var(--line);
    background:var(--panel); overflow-x:auto; }
  .rcard { flex:1 1 0; min-width:180px; background:var(--panel2); border:1px solid var(--line);
    border-radius:10px; padding:9px 12px; display:flex; gap:10px; align-items:center; }
  .avatar { width:30px;height:30px;border-radius:8px; flex:0 0 auto; display:grid; place-items:center;
    font-size:11px; font-weight:700; color:#0d1017; }
  .rcard .who { font-size:12.5px; font-weight:600; line-height:1.2; }
  .rcard .role { font-size:10.5px; color:var(--faint); }
  .posture { margin-left:auto; font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px;
    white-space:nowrap; border:1px solid transparent; }
  .posture.idle { color:var(--faint); border-color:var(--line); }
  .posture.thinking { color:var(--budget); border-color:var(--budget); animation:pulse 1.1s infinite; }
  .posture.adopt { color:var(--adopt); border-color:var(--adopt); background:#122c1a; }
  .posture.block { color:var(--block); border-color:var(--block); background:#331518; }
  .posture.circumvent { color:var(--circumvent); border-color:var(--circumvent); background:#302611; }
  .posture.escalate { color:var(--escalate); border-color:var(--escalate); background:#251b38; }

  /* ---------- body ---------- */
  .body { display:grid; grid-template-columns:1.5fr 1fr; height:calc(100vh - 168px); }
  .feed-col { display:flex; flex-direction:column; border-right:1px solid var(--line); min-height:0; }
  .col-head { padding:12px 20px 8px; font-size:11px; text-transform:uppercase; letter-spacing:1.2px;
    color:var(--dim); display:flex; align-items:center; gap:8px; }
  .col-head .n { color:var(--faint); text-transform:none; letter-spacing:0; }
  .feed { flex:1; overflow-y:auto; padding:6px 20px 24px; min-height:0; }

  /* chat bubble */
  .msg { display:flex; gap:11px; margin:14px 0; animation:rise .32s ease both; }
  .msg .av { position:relative; }
  .bubble { background:var(--panel2); border:1px solid var(--line); border-radius:4px 12px 12px 12px;
    padding:9px 13px; flex:1; }
  .bubble .top { display:flex; align-items:center; gap:9px; margin-bottom:5px; flex-wrap:wrap; }
  .bubble .nm { font-weight:600; font-size:13px; }
  .stance { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px;
    padding:2px 8px; border-radius:999px; }
  .stance.adopt { color:var(--adopt); background:#122c1a; }
  .stance.block { color:var(--block); background:#331518; }
  .stance.circumvent { color:var(--circumvent); background:#302611; }
  .stance.escalate { color:var(--escalate); background:#251b38; }
  .re { margin-left:auto; font-size:11px; color:var(--faint); }
  .re b { color:var(--dim); font-weight:600; }
  .bubble .say { font-size:14px; line-height:1.5; }
  .msg.dim { opacity:.28; }
  .msg.hot .bubble { border-color:var(--budget); box-shadow:0 0 0 1px var(--budget); }

  /* typing */
  .typing { display:flex; gap:11px; margin:14px 0; align-items:center; }
  .typing .bubble { display:inline-flex; align-items:center; gap:8px; flex:0 0 auto; color:var(--dim);
    font-size:12.5px; border-style:dashed; }
  .typing .d { width:6px;height:6px;border-radius:50%;background:var(--dim); animation:blink 1s infinite; }
  .typing .d:nth-child(2){animation-delay:.2s} .typing .d:nth-child(3){animation-delay:.4s}

  .feed .placeholder { color:var(--faint); font-size:13px; padding:30px 4px; }

  /* ---------- map ---------- */
  .map-col { display:flex; flex-direction:column; min-height:0; }
  .map { flex:1; overflow-y:auto; padding:2px 18px 20px; min-height:0; }
  .rootrow { display:flex; gap:9px; align-items:flex-start; padding:9px 10px; margin-bottom:4px;
    background:#10233b; border:1px solid var(--budget); border-radius:9px; }
  .rootrow .lbl { font-weight:600; font-size:13px; }
  .rootrow .cap { font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; }
  .erow { display:flex; gap:9px; align-items:center; padding:7px 10px; border-radius:8px; cursor:pointer;
    border:1px solid transparent; transition:background .15s,border-color .15s; }
  .erow:hover { background:var(--panel2); }
  .erow.sel { border-color:var(--budget); background:var(--panel2); }
  .erow.depth2 { margin-left:26px; }
  .erow.preempted { opacity:.4; }
  .erow.preempted .lbl { text-decoration:line-through; }
  .stat { width:9px;height:9px;border-radius:50%; flex:0 0 auto; }
  .stat.propagates{background:var(--adopt)} .stat.blocked{background:var(--block)}
  .stat.pending{background:var(--circumvent);animation:pulse 1.1s infinite} .stat.preempted{background:var(--faint)}
  .erow .lbl { font-size:13px; flex:1; }
  .erow .tag { font-size:9.5px; text-transform:uppercase; letter-spacing:.4px; padding:1px 6px;
    border-radius:4px; color:var(--dim); }
  .erow .tag.positive{color:var(--adopt)} .erow .tag.negative{color:var(--circumvent)} .erow .tag.perverse{color:var(--block)}
  .erow .owners { display:flex; gap:3px; }
  .odot { width:9px;height:9px;border-radius:3px; }
  .legend { padding:11px 18px; border-top:1px solid var(--line); font-size:11px; color:var(--dim);
    display:flex; gap:16px; flex-wrap:wrap; }
  .legend span{display:inline-flex;align-items:center;gap:6px} .legend i{width:9px;height:9px;border-radius:50%}

  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
  <header>
    <div class="brandline">
      <h1>🌊 Ripple — Change Impact Desk</h1>
      <div class="live"><span class="dot" id="dot"></span><span id="liveText">connecting…</span></div>
    </div>
    <div class="pitch" id="pitch">
      Before you pitch an AI initiative internally, see <b>who will push back and why</b> —
      so you walk into the room with every objection already answered.
    </div>
  </header>

  <div class="resistance" id="resistance"></div>

  <div class="body">
    <div class="feed-col">
      <div class="col-head">Live stakeholder negotiation <span class="n" id="feedCount"></span></div>
      <div class="feed" id="feed"><div class="placeholder">Waiting for the swarm to convene…</div></div>
    </div>
    <div class="map-col">
      <div class="col-head">Ripple map <span class="n" id="mapCount"></span></div>
      <div class="map" id="map"></div>
      <div class="legend">
        <span><i style="background:var(--adopt)"></i>propagates</span>
        <span><i style="background:var(--block)"></i>blocked</span>
        <span><i style="background:var(--circumvent)"></i>awaiting</span>
        <span><i style="background:var(--faint)"></i>pre-empted</span>
      </div>
    </div>
  </div>

<script>
const SPECS = [
  { key:"budget",  name:"Budget Sponsor",       role:"cost · ROI · hidden costs",       ini:"BS", col:"var(--budget)" },
  { key:"enduser", name:"Operational End-User", role:"workload · friction · trust",     ini:"EU", col:"var(--enduser)" },
  { key:"itdata",  name:"IT / Data Owner",      role:"data · integration · tech debt",  ini:"IT", col:"var(--itdata)" },
  { key:"risk",    name:"Risk & Compliance",    role:"regulatory · governance · rep",   ini:"RC", col:"var(--risk)" },
];
const BY = Object.fromEntries(SPECS.map(s => [s.key, s]));
const POSTURE = { adopt:"On board", block:"Will resist", circumvent:"Yes, but…", escalate:"Wants sign-off" };
const SEVERITY = { block:4, escalate:3, circumvent:2, adopt:1 };  // worst posture wins the chip

// ---- fold the (revealed slice of) events into render state ----
function fold(events) {
  const s = { initiative:null, sector:null, orgSize:null, nodes:{}, order:[],
    called:{}, stances:{}, finished:false };
  for (const e of events) {
    if (e.type === "run_started") { s.initiative=e.initiative; s.sector=e.sector; s.orgSize=e.org_size; }
    else if (e.type === "node_created") {
      if (!s.nodes[e.id]) s.order.push(e.id);
      s.nodes[e.id] = { id:e.id, parent_id:e.parent_id, label:e.label, depth:e.depth,
        polarity:e.polarity, assigned:e.assigned||[], stances:{}, pruned:false };
    }
    else if (e.type === "specialist_called") { (s.called[e.specialist] ||= new Set()); (e.node_ids||[]).forEach(id=>s.called[e.specialist].add(id)); }
    else if (e.type === "stance_received") {
      const n = s.nodes[e.node_id]; if (n) n.stances[e.specialist] = { stance:e.stance, reaction:e.reaction };
      (s.stances[e.specialist] ||= []).push(e.stance);
    }
    else if (e.type === "node_pruned") { const n=s.nodes[e.node_id]; if(n){n.pruned=true;n.pruneReason=e.reason;} }
    else if (e.type === "run_finished") s.finished = true;
  }
  return s;
}
function status(n){ if(n.pruned) return "preempted";
  const v=Object.values(n.stances); if(v.some(x=>x.stance==="block")) return "blocked";
  if(n.assigned.length && n.assigned.every(k=>n.stances[k])) return "propagates"; return "pending"; }
function posture(stanceList){ if(!stanceList||!stanceList.length) return null;
  return stanceList.slice().sort((a,b)=>SEVERITY[b]-SEVERITY[a])[0]; }

function esc(x){ return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function av(sp){ return `<div class="avatar" style="background:${sp.col}">${sp.ini}</div>`; }

let focusId = null;

// ---- render ----
function render(revealed, full) {
  const s = fold(revealed);
  const sFull = fold(full);

  // header
  document.getElementById("pitch").innerHTML = s.initiative
    ? `Forecasting internal resistance to: <b>${esc(s.initiative)}</b>` +
      (s.sector && s.sector!=="(not specified)" ? ` &nbsp;·&nbsp; ${esc(s.sector)}` : "") +
      (s.orgSize && s.orgSize!=="(not specified)" ? ` &nbsp;·&nbsp; ${esc(s.orgSize)}` : "")
    : "Before you pitch an AI initiative internally, see <b>who will push back and why</b>.";
  document.getElementById("liveText").textContent =
    s.finished && revealed.length===full.length ? "verdict ready ✓" : "negotiation live…";

  // resistance strip
  document.getElementById("resistance").innerHTML = SPECS.map(sp => {
    const p = posture(s.stances[sp.key]);
    const thinking = !p && s.called[sp.key] && s.called[sp.key].size;
    const cls = p ? p : (thinking ? "thinking" : "idle");
    const txt = p ? POSTURE[p] : (thinking ? "weighing in…" : "not yet consulted");
    return `<div class="rcard">${av(sp)}
      <div><div class="who">${sp.name}</div><div class="role">${sp.role}</div></div>
      <div class="posture ${cls}">${txt}</div></div>`;
  }).join("");

  renderFeed(s, sFull);
  renderMap(s);
}

function renderFeed(s, sFull) {
  const feed = document.getElementById("feed");
  const bubbles = [];
  // conversation in revealed order
  for (const e of window._revealed) {
    if (e.type !== "stance_received") continue;
    const sp = BY[e.specialist]; const node = s.nodes[e.node_id] || sFull.nodes[e.node_id] || {};
    const hot = focusId && e.node_id === focusId;
    const dim = focusId && e.node_id !== focusId;
    bubbles.push(`<div class="msg ${hot?'hot':''} ${dim?'dim':''}">
      <div class="av">${av(sp)}</div>
      <div class="bubble">
        <div class="top"><span class="nm">${sp.name}</span>
          <span class="stance ${e.stance}">${e.stance}</span>
          <span class="re">re: <b>${esc(node.label||e.node_id)}</b></span></div>
        <div class="say">“${esc(e.reaction)}”</div>
      </div></div>`);
  }
  // typing indicators: called specialists who still have unrevealed stances coming
  const revealedCountBySpec = {};
  window._revealed.forEach(e => { if(e.type==="stance_received") revealedCountBySpec[e.specialist]=(revealedCountBySpec[e.specialist]||0)+1; });
  const totalBySpec = {};
  window._full.forEach(e => { if(e.type==="stance_received") totalBySpec[e.specialist]=(totalBySpec[e.specialist]||0)+1; });
  for (const sp of SPECS) {
    const called = s.called[sp.key] && s.called[sp.key].size;
    const more = (totalBySpec[sp.key]||0) > (revealedCountBySpec[sp.key]||0);
    if (called && more) bubbles.push(`<div class="typing">${av(sp)}
      <div class="bubble"><b style="color:var(--ink);font-weight:600">${sp.name}</b> is weighing in
      <span class="d"></span><span class="d"></span><span class="d"></span></div></div>`);
  }

  feed.innerHTML = bubbles.length ? bubbles.join("")
    : `<div class="placeholder">Waiting for the swarm to convene…</div>`;
  document.getElementById("feedCount").textContent =
    bubbles.filter(b=>b.includes("class=\"bubble\"")).length ? `${window._revealed.filter(e=>e.type==="stance_received").length} reactions` : "";

  // autoscroll if near bottom
  if (window._stick !== false) feed.scrollTop = feed.scrollHeight;
}
// keep autoscroll only when user is at the bottom
document.addEventListener("DOMContentLoaded", () => {
  const feed = document.getElementById("feed");
  feed.addEventListener("scroll", () => {
    window._stick = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60;
  });
});

function renderMap(s) {
  const map = document.getElementById("map");
  let html = "";
  if (s.initiative) html += `<div class="rootrow"><div class="stat" style="background:var(--budget)"></div>
    <div><div class="cap">Initiative</div><div class="lbl">${esc(s.initiative)}</div></div></div>`;
  const directs = s.order.map(id=>s.nodes[id]).filter(n=>n.depth===1);
  for (const d of directs) {
    html += rowHtml(d);
    s.order.map(id=>s.nodes[id]).filter(n=>n.parent_id===d.id).forEach(c => html += rowHtml(c));
  }
  map.innerHTML = html || `<div class="placeholder" style="padding:20px 4px">Mapping ripple effects…</div>`;
  document.getElementById("mapCount").textContent = s.order.length ? `${s.order.length} effects` : "";
  map.querySelectorAll(".erow").forEach(r => r.onclick = () => {
    focusId = (focusId === r.dataset.id) ? null : r.dataset.id;
    window._stick = false; render(window._revealed, window._full);
    if (focusId) { const first=document.querySelector(".msg.hot"); if(first) first.scrollIntoView({block:"center",behavior:"smooth"}); }
  });
}
function rowHtml(n) {
  const st = status(n);
  const owners = n.assigned.map(k=>`<span class="odot" title="${BY[k]?.name||k}" style="background:${BY[k]?.col||'#888'}"></span>`).join("");
  return `<div class="erow depth${n.depth} ${st} ${focusId===n.id?'sel':''}" data-id="${n.id}">
    <div class="stat ${st}"></div>
    <span class="lbl">${esc(n.label)}</span>
    <span class="tag ${n.polarity}">${n.polarity}</span>
    <span class="owners">${owners}</span></div>`;
}

// ---- polling + conversational paced reveal ----
window._revealed = []; window._full = []; window._stick = true;
let cursor = 0, prevLen = 0;

async function poll() {
  try {
    const res = await fetch(`events.json?t=${Date.now()}`, { cache:"no-store" });
    if (!res.ok) throw new Error(res.status);
    const events = await res.json();
    if (events.length < prevLen) { cursor = 0; }   // a fresh run reset the file → replay
    prevLen = events.length;
    window._full = events;
    document.getElementById("dot").style.background = "var(--adopt)";
  } catch(e) {
    document.getElementById("liveText").textContent = "waiting for events.json…";
    document.getElementById("dot").style.background = "var(--circumvent)";
  }
}
// Reveal loop: non-conversation events appear at once (map builds, typing starts);
// each stance_received is revealed one per tick so it reads like people speaking in turn.
function tick() {
  const full = window._full;
  let spoke = false;
  while (cursor < full.length) {
    const t = full[cursor].type;
    if (t === "stance_received") { if (spoke) break; cursor++; spoke = true; break; }
    cursor++;                                   // reveal instantly, keep consuming
  }
  window._revealed = full.slice(0, cursor);
  render(window._revealed, window._full);
}

poll(); setInterval(poll, 1000);
setInterval(tick, 850);
</script>
</body>
</html>
